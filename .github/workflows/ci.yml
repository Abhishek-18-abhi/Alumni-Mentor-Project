name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Lint, Test & Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend & Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check Code Formatting
        run: npx prettier --check frontend

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Run Backend Tests (Node Test Runner + MongoMemoryServer)
        working-directory: ./backend
        run: npm test

      - name: Build Frontend Application
        run: npm run build

      - name: Security Audit Check
        run: npm audit --audit-level=critical || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t mentorconnect-backend:test -f Dockerfile.backend .

      - name: Build Frontend Docker Image
        run: docker build -t mentorconnect-frontend:test -f Dockerfile.frontend --build-arg VITE_API_URL=http://localhost:5000/api .
